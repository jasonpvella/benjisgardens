backend:
  name: git-gateway
  branch: main

media_folder: public/images
public_folder: /images

collections:
  - name: blog
    label: Blog Posts
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
      - label: Publish Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
      - label: Description
        name: description
        widget: string
        hint: "Appears under the title on the blog listing page and in Google search results. Keep it under 160 characters."
      - label: Featured Image
        name: image
        widget: image
        required: false
        hint: "Optional. Appears at the top of the post and on the listing card."
      - label: Body
        name: body
        widget: markdown
